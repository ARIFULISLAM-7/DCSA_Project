<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your dashboard — Havenwork</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div id="site-navbar"></div>
</header>

<main class="container">
  <div class="page-head">
    <h1 id="dash-greeting">Welcome back</h1>
    <p class="muted">Here's where things stand with your search.</p>
  </div>

  <div class="layout-with-sidebar" style="margin-top:20px;">
    <aside id="dash-sidebar"></aside>

    <div>
      <div class="stat-grid" id="applicant-stats"></div>

      <div class="panel" style="margin-top:20px;">
        <div class="flex-between">
          <h3>Profile completeness</h3>
        </div>
        <div id="profile-status"></div>
      </div>

      <div class="panel">
        <div class="flex-between">
          <h3>Recent applications</h3>
          <a href="applicant-applied.html" class="muted">View all ›</a>
        </div>
        <div id="recent-applications"></div>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div id="site-footer"></div>
</footer>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/applicant-dashboard.js"></script>
</body>
</html>
