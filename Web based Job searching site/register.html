<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Create an account — Havenwork</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div id="site-navbar"></div>
</header>

<main>
  <div class="form-card" style="max-width:480px;">
    <h1>Create your account</h1>
    <p class="subtext">Tell us what you're here to do.</p>

    <div class="role-toggle">
      <label>
        <input type="radio" name="role" value="applicant" checked />
        <span>I'm looking for work</span>
      </label>
      <label>
        <input type="radio" name="role" value="employer" />
        <span>I'm hiring</span>
      </label>
    </div>

    <form id="register-form">
      <div class="field">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" required />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="reg-username">Username</label>
          <input type="text" id="reg-username" required />
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" required />
        </div>
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" minlength="6" required />
        <p class="hint">At least 6 characters.</p>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="form-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</main>

<footer class="site-footer">
  <div id="site-footer"></div>
</footer>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth-pages.js"></script>
</body>
</html>
