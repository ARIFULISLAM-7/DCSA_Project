<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Applications — Havenwork</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div id="site-navbar"></div>
</header>

<main class="container">
  <div class="page-head">
    <h1>Applications</h1>
    <p class="muted">Everyone who has applied across all of your listings.</p>
  </div>

  <div class="layout-with-sidebar" style="margin-top:20px;">
    <aside id="dash-sidebar"></aside>

    <div class="panel">
      <div class="field" style="max-width:280px;">
        <label for="job-filter">Filter by job</label>
        <select id="job-filter"></select>
      </div>
      <div id="applications-table"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div id="site-footer"></div>
</footer>

<script src="js/db.js"></script>
<script src="js/ui.js"></script>
<script src="js/employer-applications.js"></script>
</body>
</html>
